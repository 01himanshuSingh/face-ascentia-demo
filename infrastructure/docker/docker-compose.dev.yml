services:
  db:
    image: pgvector/pgvector:pg16
    container_name: face-auth-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-face_auth}
      POSTGRES_USER: ${POSTGRES_USER:-face_auth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - face_auth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-face_auth} -d ${POSTGRES_DB:-face_auth}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  face_auth_pgdata:
